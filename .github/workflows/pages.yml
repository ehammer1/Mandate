# Publishes the voter web app (app/) to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Optional: communities with their own web address (vote.lincolnhigh.org) are served from
# Cloudflare Pages, which allows many addresses for free. Add the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/new-community.md) and each build is
# published there too; without them that step is skipped.
name: Voter app (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['app/**', 'client/**', 'scripts/build-app.js', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --force: ganache (a test-only dependency) bundles a macOS-only package that
      # otherwise fails npm's platform check on Linux; --ignore-scripts runs nothing from it.
      - run: npm ci --ignore-scripts --force
      - run: node scripts/build-app.js
      - name: Use the Base testnet deployment
        run: cp app/config.base-sepolia.json app/config.json
      - name: Stamp this version on the app's files, so phones load the new code instead of a stale copy
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(dist/(main|dashboard|notice|proposal|one-pager)\.js)\"#\1?v=$v\"#; s#(style\.css)\"#\1?v=$v\"#" app/*.html
          grep -o 'dist/[a-z]*\.js?v=[0-9a-f]*' app/index.html app/dashboard.html
      - name: Drop sources and source maps from the published site
        run: rm -rf app/src && find app/dist -name "*.map" -delete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Also publish to Cloudflare Pages, for communities' own web addresses (only once set up)
        if: env.CF_READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'promissa' }} --branch=main --commit-dirty=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
