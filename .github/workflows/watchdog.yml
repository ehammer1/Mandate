# Backup runner for the watchdog. The main runner is the Render cron job (every 15 minutes,
# render.yaml), because GitHub runs schedules only when it has spare capacity. Both
# publish to the `watchdog` branch, a permanent public audit history, and safely take turns.
#   alerts:  https://github.com/ehammer1/Mandate/blob/watchdog/alerts.json
#   report:  https://github.com/ehammer1/Mandate/blob/watchdog/report.md
# Optional repository secrets: WATCHDOG_WEBHOOK_URL (urgent alerts to Slack/Discord),
# ANTHROPIC_API_KEY (plain-language reports by Claude; rules work without it).
name: Watchdog audit

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts --force
      - name: Load the audit history
        run: |
          git fetch origin watchdog:watchdog
          git worktree add watchdog-data watchdog
      - name: Scan
        env:
          CONFIG_URL: https://ehammer1.github.io/Mandate/config.json
          STATE_DIR: watchdog-data
          WEBHOOK_URL: ${{ secrets.WATCHDOG_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node services/watchdog/server.js --once
      - name: Publish findings
        if: always()
        working-directory: watchdog-data
        run: |
          git config user.name "mandate-watchdog"
          git config user.email "watchdog@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Watchdog scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin watchdog
