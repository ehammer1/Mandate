# Render blueprint (render.com -> New -> Blueprint -> this repo).
# Both services read contract addresses from the published voter app config, so
# redeploying the contracts needs no changes here.
services:
  # Submits anonymous ballots and pays their fees, so voters need no wallet.
  - type: web
    name: mandate-relayer
    runtime: node
    plan: free
    # --force: a test-only dependency bundles a macOS-only package that fails npm's Linux platform check
    buildCommand: npm ci --omit=dev --ignore-scripts --force
    startCommand: node broker/relayer.js
    healthCheckPath: /health
    envVars:
      - key: CONFIG_URL
        value: https://ehammer1.github.io/Mandate/config.json
      - key: RELAYER_PRIVATE_KEY
        sync: false          # a funded key used only to pay ballot fees
      - key: RATE_LIMIT_PER_MIN
        value: "30"

  # Sign-in identity service: enrols voter codes for people who sign in with
  # Google / Apple / Microsoft (basic) or an identity-verified provider (verified).
  - type: web
    name: mandate-identity
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --ignore-scripts --force
    startCommand: node services/identity/server.js
    healthCheckPath: /health
    envVars:
      - key: CONFIG_URL
        value: https://ehammer1.github.io/Mandate/config.json
      - key: PUBLIC_URL
        value: https://mandate-identity.onrender.com
      - key: ALLOWED_RETURN_ORIGINS
        value: https://ehammer1.github.io
      - key: ISSUER_SEED          # Render generates this; the service derives its key from it
        generateValue: true
      - key: IDENTITY_PEPPER      # secret for account fingerprints; never change it once in use
        generateValue: true
      - key: EMAIL_DOMAINS_ALLOW   # "reputable" = major providers + .gov/.edu; add your own, comma-separated
        value: reputable
      - key: EMAIL_PROVIDER        # email sign-up: resend | sendgrid | postmark (leave empty to turn off)
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM            # sender address, e.g. "Mandate <signup@yourdomain.org>"
        sync: false
      # Voter roll for clerk-desk lookups (scripts/roll-import.js). TESTNET DEMO: a fictional roll
      # whose key is public on purpose (demo/README.md). For a real roll, set ROLL_KEY as a
      # secret in the dashboard instead (sync: false) and never commit it.
      - key: ROLL_URL
        value: https://ehammer1.github.io/Mandate/roll/demo-or.json
      - key: ROLL_KEY
        value: mandate-testnet-demo-roll-key-fictional-people-only
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false

  # Independent watchdog: scans every contract every 15 minutes and publishes its
  # findings to the repository's `watchdog` branch (the public audit history the
  # dashboard reads). Render cron jobs are paid: billed per second, $1/month minimum.
  - type: cron
    name: mandate-watchdog
    runtime: node
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: npm ci --omit=dev --ignore-scripts --force
    startCommand: bash scripts/watchdog-cron.sh
    envVars:
      - key: CONFIG_URL
        value: https://ehammer1.github.io/Mandate/config.json
      - key: GITHUB_REPO
        value: ehammer1/Mandate
      - key: GITHUB_TOKEN
        sync: false          # fine-grained token: this repository only, Contents read and write
      - key: WEBHOOK_URL
        sync: false          # optional: urgent alerts to Slack or Discord
      - key: ANTHROPIC_API_KEY
        sync: false          # optional: plain-language daily reports
