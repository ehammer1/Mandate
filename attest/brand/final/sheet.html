<!doctype html><html><head><meta charset="utf-8"><title>Testimonia brand</title><style>
body{margin:0;padding:32px;background:#f5f6fa;font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;color:#262a6e}
h1{margin:0 0 4px;font-size:22px}.sub{margin:0 0 24px;color:#5a5f8f;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dark{background:#262a6e}.card h2{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#8a8fb8}
.wide{grid-column:span 2}.row{display:flex;gap:22px;align-items:center;flex-wrap:wrap}img{display:block}
</style></head><body><h1>Testimonia</h1><p class="sub">Primary mark H (chain ring), secondary mark J (chain T). Navy #262a6e, teal #14a99a, wordmark in Inter Display SemiBold (outlined).</p>
<div class="grid">
<div class="card wide"><h2>Horizontal lockup</h2><img src="testimonia-lockup.svg" height="110"></div>
<div class="card wide dark"><h2>On navy</h2><img src="testimonia-lockup-white.svg" height="110"></div>
<div class="card"><h2>Primary mark</h2><div class="row"><img src="testimonia-mark.svg" width="160"><img src="testimonia-mark.svg" width="64"><img src="testimonia-mark.svg" width="40"></div></div>
<div class="card"><h2>Secondary mark</h2><div class="row"><img src="testimonia-chain-t.svg" width="160"><img src="testimonia-chain-t.svg" width="64"><img src="testimonia-chain-t.svg" width="40"></div></div>
<div class="card"><h2>Stacked lockup</h2><img src="testimonia-lockup-stacked.svg" height="200"></div>
<div class="card"><h2>App icon and favicon</h2><div class="row"><img src="testimonia-app-icon.svg" width="120"><img src="testimonia-app-icon.svg" width="60"><img src="testimonia-favicon.svg" width="32"><img src="testimonia-favicon.svg" width="16"></div></div>
</div></body></html>
